name: 质量门禁
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make race
  databases:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: "%"
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pci-only-password" --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-mysql
        env:
          db_mysql_host: 127.0.0.1
          db_mysql_port: '3306'
          db_mysql_user: root
          db_mysql_pwd: ci-only-password
          db_mysql_db_name: mysql
      - run: make test-postgres
        env:
          FLOWABLE_POSTGRES_DSN: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres?sslmode=disable
